<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2C6F"/>
      <stop offset="0.55" stop-color="#134FB8"/>
      <stop offset="1" stop-color="#1D6FE0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- brillo sutil -->
  <path d="M0 0 H512 V190 Q256 260 0 190 Z" fill="#FFFFFF" opacity="0.05"/>

  <!-- Barras de comparación (precios distintos) -->
  <g>
    <rect x="96"  y="150" width="200" height="44" rx="22" fill="#FFFFFF" opacity="0.92"/>
    <rect x="96"  y="234" width="264" height="44" rx="22" fill="#FFFFFF" opacity="0.55"/>
    <rect x="96"  y="318" width="152" height="44" rx="22" fill="#FFFFFF" opacity="0.32"/>
    <!-- check en la barra más corta = la mejor opción -->
    <path d="M120 340 l14 15 26 -28" fill="none" stroke="#0B2C6F" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Rayo -->
  <path d="M382 96 L296 268 L352 268 L306 424 L430 232 L366 232 Z"
        fill="url(#bolt)" stroke="#0B2C6F" stroke-width="14" stroke-linejoin="round"/>
</svg>
