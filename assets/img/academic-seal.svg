<?xml version="1.0" encoding="UTF-8"?>
<svg width="150" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="75" cy="75" r="70" fill="none" stroke="#003366" stroke-width="3"/>

  <!-- Inner circle -->
  <circle cx="75" cy="75" r="60" fill="none" stroke="#003366" stroke-width="2"/>

  <!-- Top text along curve -->
  <path id="top-curve" d="M 25,75 A 50,50 0 0,1 125,75" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#003366">
    <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
      REPÚBLICA DOMINICANA
    </textPath>
  </text>

  <!-- Center emblem (simplified Dominican coat of arms elements) -->
  <g transform="translate(75,75)">
    <!-- Shield shape -->
    <path d="M -20,-15 L 20,-15 L 20,10 L 0,25 L -20,10 Z"
          fill="none" stroke="#003366" stroke-width="2"/>

    <!-- Cross in the shield -->
    <line x1="0" y1="-10" x2="0" y2="20" stroke="#003366" stroke-width="2"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#003366" stroke-width="2"/>

    <!-- Book symbol (for education) -->
    <rect x="-8" y="-6" width="16" height="12" fill="none" stroke="#003366" stroke-width="1"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#003366" stroke-width="1"/>
  </g>

  <!-- Bottom text along curve -->
  <path id="bottom-curve" d="M 125,75 A 50,50 0 0,1 25,75" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#003366">
    <textPath href="#bottom-curve" startOffset="50%" text-anchor="middle">
      SISTEMA ACADÉMICO
    </textPath>
  </text>

  <!-- Stars or decorative elements -->
  <text x="75" y="45" font-family="Arial" font-size="20" text-anchor="middle" fill="#003366">★</text>
  <text x="75" y="110" font-family="Arial" font-size="20" text-anchor="middle" fill="#003366">★</text>
</svg>